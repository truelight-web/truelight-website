<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Truelight - 웹사이트 준비 중</title>
  <style>
    :root {
      --bg: #fafaf7;
      --text: #1f2328;
      --muted: #6b7280;
      --accent: #e0a526;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --accent: #f2c14e;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      text-align: center;
    }
    .dot {
      width: 12px;
      height: 12px;
      margin: 0 auto 28px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 24px var(--accent);
    }
    h1 {
      font-size: clamp(2.25rem, 7vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    p {
      margin-top: 12px;
      font-size: 1.125rem;
      color: var(--muted);
    }
    footer {
      margin-top: 48px;
      font-size: 0.875rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <div class="dot" aria-hidden="true"></div>
    <h1>Truelight</h1>
    <p>웹사이트 준비 중입니다. 곧 찾아뵙겠습니다.</p>
    <footer>&copy; 2026 Truelight</footer>
  </main>
</body>
</html>
